name: Manual Dispatch CI

on:
  push:
    branches:
      - main
      - feature/opshop-pickup
      - feature/separate-delivery-and-opshop-workspaces
  pull_request:
    branches:
      - main
      - feature/opshop-pickup
      - feature/separate-delivery-and-opshop-workspaces
  workflow_dispatch:

jobs:
  test:
    name: Python tests and frontend syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MANUAL_DISPATCH_DB_PATH: tmp/manual_dispatch_ci.sqlite3
      MANUAL_DISPATCH_LOGBOOK_DIR: tmp/manual_dispatch_ci_logbook
      MANUAL_DISPATCH_AUTH_COOKIE_SECRET: final-hardening-ci-validation-secret
      MANUAL_DISPATCH_ALLOW_REGISTRATION: "false"
      MANUAL_DISPATCH_SEED_DEMO_DATA: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python files
        run: python -m compileall backend tests tools

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend entry script syntax
        run: node --check frontend/app.js

      - name: Check all frontend JavaScript syntax
        run: find frontend -type f -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Check whitespace errors
        run: git diff --check

  windows-smoke-checks:
    name: Windows smoke checks
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      MANUAL_DISPATCH_DB_PATH: tmp/manual_dispatch_ci.sqlite3
      MANUAL_DISPATCH_LOGBOOK_DIR: tmp/manual_dispatch_ci_logbook
      MANUAL_DISPATCH_AUTH_COOKIE_SECRET: final-hardening-ci-validation-secret
      MANUAL_DISPATCH_ALLOW_REGISTRATION: "false"
      MANUAL_DISPATCH_SEED_DEMO_DATA: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python files
        shell: pwsh
        run: python -m compileall backend tests tools

      - name: Run Python unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Check frontend entry script syntax
        shell: pwsh
        run: node --check frontend/app.js

      - name: Check all frontend JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem frontend -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check
